<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Pangat (पंगत) | Zero-Hardware Table Ordering & Kitchen Orchestration</title>
    <meta name="description" content="Modern dining speed, rooted in timeless hospitality. Instant UPI payments, zero thermal printers, and live kitchen tracking for independent cafes and specialty coffee spots." />
    <meta name="theme-color" content="#059669" />
    <script>
      (function() {
        try {
          var isAuthOrLanding = window.location.pathname === '/' ||
            window.location.pathname === '' ||
            window.location.pathname.startsWith('/login') ||
            window.location.pathname.startsWith('/kds-login');
          if (isAuthOrLanding) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            return;
          }
          var saved = localStorage.getItem('pangat_theme');
          var isDark = saved ? saved === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
